[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "color-harness"
version = "0.1.0"
description = "Governed nine-team DevOps agent coordination system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Color Harness contributors"}]

[tool.setuptools.packages.find]
include = ["colorharness*"]
